    <body vocab="https://schema.org/" typeof="WebPage">
        <div id="def-top">
            <!-- Write closure fall-back static file -->
            <!-- top-en.html -->
        </div>
        <!-- Write closure template -->
        <script>
            var defTop = document.getElementById("def-top");

            defTop.outerHTML = wet.builder.top({
                "cdnEnv": "prod",
                "lngLinks": false,
                "search": false,
                "siteMenu": false,
                "showPreContent": false,
                "breadcrumbs": false
            });
        </script>

        <main property="mainContentOfPage" typeof="WebPageElement" class="container">
            <h1 property="name" id="wb-cont">Post task survey</h1>

            <section class="mrgn-bttm-xl">
                <p>Please select one option from each of the following questions.</p>

                <!-- Question 1 Start-->

                <fieldset class="provisional gc-chckbxrdio mrgn-tp-lg">
                    <legend>1. On a scale of 1 to 7, how difficult or easy did you find this task?</legend>
                    <ul class="list-unstyled lst-spcd-2">
                        <li class="radio">
                            <input type="radio" name="task-rating" id="1-very-difficult">
                            <label for="1-very-difficult">1 - Very difficult</label>
                        </li>
                        <li class="radio">
                            <input type="radio" name="task-rating" id="2-difficult">
                            <label for="2-difficult">2 - Difficult</label>
                        </li>
                        <li class="radio">
                            <input type="radio" name="task-rating" id="3-somewhat-difficult">
                            <label for="3-somewhat-difficult">3 - Somewhat difficult</label>
                        </li>
                        <li class="radio">
                            <input type="radio" name="task-rating" id="4-neutral">
                            <label for="4-neutral">4 - Neutral</label>
                        </li>
                        <li class="radio">
                            <input type="radio" name="task-rating" id="5-somewhat-easy">
                            <label for="5-somewhat-easy">5 - Somewhat easy</label>
                        </li>
                        <li class="radio">
                            <input type="radio" name="task-rating" id="6-easy">
                            <label for="6-easy">6 - Easy</label>
                        </li>
                        <li class="radio">
                            <input type="radio" name="task-rating" id="7-very-easy">
                            <label for="7-very-easy">7 - Very easy</label>
                        </li>
                    </ul>
                </fieldset>

                <!-- Question 1 End-->

                <!-- Question 2 Start -->

                <fieldset class="provisional gc-chckbxrdio mrgn-tp-lg">
                    <legend>2. Could you complete this task?</legend>
                    <ul class="list-unstyled lst-spcd-2">
                        <li class="radio">
                            <input type="radio" name="task-completion" id="task-completion-success">
                            <label for="task-completion" id="task-completion-success">Yes, I could complete this task</label>
                        </li>
                        <li class="radio">
                            <input type="radio" name="task-completion" id="task-completion-fail">
                            <label for="task-completion-fail">No, I could not complete this task</label>
                        </li>
                    </ul>
                </fieldset>

                <!-- Question 2 End -->

                <div class="clearfix"></div>
                <a href="task-page.html" data-exit="false" role="button" class="btn btn-primary btn-lg mrgn-tp-md">Continue to task page</a>
            </section>

            <div id="def-preFooter">
                <!-- Write closure fall-back static file -->
                <!-- preFooter-en.html -->

            <script>
                var defPreFooter = document.getElementById("def-preFooter");

        </main>
